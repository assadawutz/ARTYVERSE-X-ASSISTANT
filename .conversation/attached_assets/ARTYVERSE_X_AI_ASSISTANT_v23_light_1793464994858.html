<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f3f1ec">
<meta name="description" content="ผู้ช่วยตอบคำถามสดและเตรียมบทพูดภาษาไทย ไฟล์เดียว ใช้งานในเครื่อง">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230d1017%27/%3E%3Cpath d=%27M16 6l8 20h-4l-1.6-4.4h-4.8L12 26H8z M14.4 18.4h3.2L16 13.6z%27 fill=%27%23ff5b2e%27/%3E%3C/svg%3E">
<title>ARTYVERSE X AI ASSISTANT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --bg2:#fbfaf7; --panel:#ffffff; --ink:#0d1017; --mut:rgba(13,16,23,.74); --faint:rgba(13,16,23,.52);
  --line:rgba(13,16,23,.10); --line2:rgba(13,16,23,.18);
  --s1:rgba(255,255,255,.72); --s2:rgba(13,16,23,.045); --s3:rgba(13,16,23,.085);
  --accent:#3d35ff; --accent-2:#ff5b2e; --accent-ink:#fff; --accent-soft:rgba(61,53,255,.09); --accent-line:rgba(61,53,255,.32);
  --ok:#0f8a52; --bad:#d6264a;
  --glass:rgba(255,255,255,.66); --glass-b:rgba(255,255,255,.9);
  --sh1:0 1px 2px rgba(13,16,23,.05),0 8px 24px -12px rgba(13,16,23,.14);
  --sh2:0 2px 4px rgba(13,16,23,.05),0 24px 48px -20px rgba(13,16,23,.26);
  --ease:cubic-bezier(.2,.7,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --f-head:"Space Grotesk","IBM Plex Sans Thai",system-ui,sans-serif; --f-body:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --para:17px; --r:22px; --gut:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:
  radial-gradient(60rem 36rem at 105% -10%,rgba(61,53,255,.10),transparent 60%),
  radial-gradient(48rem 30rem at -10% 40%,rgba(255,91,46,.07),transparent 60%),
  var(--bg);
  color:var(--ink);font:400 16px/1.75 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;
  -webkit-mask-image:radial-gradient(70% 55% at 50% 0%,#000,transparent);mask-image:radial-gradient(70% 55% at 50% 0%,#000,transparent)}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer;touch-action:manipulation;position:relative;overflow:hidden}
select{background:var(--panel);border-radius:12px;padding:10px 12px;border:1px solid var(--line);width:100%;outline:none}
input[type=text],input[type=search],textarea{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;font-size:15px}
input:focus,textarea:focus,select:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);pointer-events:none;animation:rip .6s var(--ease) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* Shell */
.app{position:relative;z-index:1;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.top{position:relative;z-index:30;display:flex;align-items:center;gap:6px;margin:max(env(safe-area-inset-top),8px) var(--gut) 0;padding:7px 8px 7px 10px;border:1px solid var(--glass-b);border-radius:20px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:var(--sh1)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:36px;height:36px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;transition:transform .5s var(--spring)}
.mark svg{width:22px;height:22px}
.brand:hover .mark{transform:rotate(-8deg) scale(1.06)}
.brand-name{font:700 12.5px/1.1 var(--f-head);letter-spacing:.14em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name b{color:var(--accent-2)}
.brand-sub{font:500 11px/1.3 var(--f-mono);letter-spacing:.06em;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;align-items:center;gap:7px;font:500 11.5px var(--f-mono);color:var(--faint);letter-spacing:.05em;white-space:nowrap;padding:0 6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(15,138,82,.5);animation:pulse 2.4s infinite}
.status.demo i{background:var(--faint);animation:none}
.status.off i{background:var(--bad);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(15,138,82,0)}100%{box-shadow:0 0 0 0 rgba(15,138,82,0)}}
.top-btn{min-height:40px;min-width:40px;padding:0;justify-content:center;border-radius:14px;border:1px solid transparent;color:var(--mut);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:background .2s,color .2s,transform .3s var(--spring)}
.top-btn:hover{background:var(--s2);color:var(--ink)}
.top-btn:active{transform:scale(.92)}
.top-btn[aria-pressed="true"]{background:var(--ink);color:#fff}
.top-btn.warn{color:var(--bad)}
.top-btn .lbl{display:none}

.body{min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.thread{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px var(--gut) 28px;scroll-behavior:smooth}
.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

/* Side panel : bottom sheet on mobile */
.side{position:fixed;left:8px;right:8px;bottom:8px;height:min(74dvh,640px);z-index:60;border:1px solid var(--glass-b);border-radius:26px;background:var(--glass);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6);box-shadow:var(--sh2);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(24px) scale(.98);pointer-events:none;transition:opacity .35s var(--ease),transform .5s var(--spring)}
.side::before{content:"";width:38px;height:4px;border-radius:9px;background:var(--line2);margin:8px auto 0;flex:none}
.body.panel-on .side{opacity:1;transform:none;pointer-events:auto}
.body.panel-on .thread{opacity:.5;transition:opacity .3s var(--ease)}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tab{min-height:38px;border-radius:12px;font:600 12.5px var(--f-head);color:var(--mut);transition:background .2s,color .2s}
.tab:hover{background:var(--s2)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.side-body{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.side-item{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:12px 14px;text-align:left;transition:transform .3s var(--spring),box-shadow .3s}
.side-item:hover{transform:translateY(-2px);box-shadow:var(--sh1)}
.side-h{font:600 13px var(--f-head);color:var(--ink);margin-top:4px}
.field{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.field label{font-size:13.5px;color:var(--mut)}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font:600 14px var(--f-head);transition:transform .25s var(--spring)}
.stepper button:hover{background:var(--s2)}
.stepper button:active{transform:scale(.9)}
.stepper output{min-width:64px;text-align:center;font:500 13px var(--f-mono);color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:6px}
.tool{min-height:40px;padding:0 14px;border-radius:999px;color:var(--ink);background:var(--panel);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);transition:background .2s,color .2s,transform .3s var(--spring),border-color .2s}
.tool:hover{border-color:var(--line2);background:var(--bg2)}
.tool:active{transform:scale(.94)}
.tool.ok{color:var(--ok);border-color:rgba(15,138,82,.4)}
.tool.danger{color:var(--bad)}
.tool:disabled{opacity:.35;cursor:not-allowed}

/* Empty state : minimal */
.empty{display:flex;flex-direction:column;gap:18px;padding:clamp(8px,6vh,56px) 0 12px;animation:rise .6s var(--ease) both}
.empty h1{font:700 clamp(2rem,8vw,3.2rem)/1.05 var(--f-head);letter-spacing:-.03em;text-wrap:balance}
.empty h1 em{font-style:normal;color:var(--accent)}
.empty p{color:var(--mut);max-width:42ch;font-size:15.5px}
.sugg{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.chip{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:56px;padding:12px 18px;border-radius:18px;border:1px solid var(--glass-b);background:var(--glass);box-shadow:var(--sh1);font:600 15.5px/1.4 var(--f-body);text-align:left;transition:transform .4s var(--spring),box-shadow .3s,border-color .2s}
.chip svg{color:var(--accent);transition:transform .4s var(--spring)}
.chip:hover{transform:translateY(-2px);border-color:var(--accent-line);box-shadow:var(--sh2)}
.chip:hover svg{transform:translateX(4px)}
.chip:active{transform:scale(.98)}
@media (min-width:900px){.sugg{flex-direction:row}.chip{flex:1;align-items:flex-start;flex-direction:column;min-height:104px}}

/* Question & pipeline */
.q{display:flex;flex-direction:column;gap:8px;animation:rise .5s var(--ease) both}
.q-label{font:500 11.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.q-text{font:700 clamp(1.4rem,6vw,2.1rem)/1.2 var(--f-head);letter-spacing:-.02em;text-wrap:balance}
.pipe{border:1px solid var(--glass-b);border-radius:var(--r);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh1);padding:20px 22px;display:flex;flex-direction:column;gap:14px;animation:rise .4s var(--ease) both}
.pipe-title{font:500 12.5px var(--f-mono);color:var(--mut)}
.stages{display:flex;flex-direction:column;gap:9px;list-style:none}
.stages li{display:flex;align-items:center;gap:12px;font-size:14.5px;color:var(--faint);transition:color .3s}
.stages .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;flex:none;font:500 11.5px var(--f-mono);transition:all .4s var(--spring)}
.stages li.on{color:var(--ink)}
.stages li.on .dot{border-color:var(--accent);color:var(--accent);transform:scale(1.15);box-shadow:0 0 0 4px var(--accent-soft)}
.stages li.done{color:var(--mut)}
.stages li.done .dot{background:var(--ink);border-color:var(--ink);color:#fff}
.pipe .bar{height:4px;border-radius:99px;background:var(--s2);overflow:hidden}
.pipe .bar span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s var(--ease)}
.pv{font-size:15px;color:var(--mut);min-height:1.6em}

/* Answer card : bento */
.card{border-radius:26px;border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--sh2);overflow:hidden;animation:rise .6s var(--ease) both;padding-bottom:2px}
.card-head{padding:22px 20px 0}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--mut);background:var(--panel)}
.badge.web{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.badge.high{color:var(--ok);border-color:rgba(15,138,82,.4)}
.badge.low{color:var(--bad);border-color:rgba(214,38,74,.4)}
.badge.alt{color:var(--faint)}
.card-title{margin-top:14px;font:700 clamp(1.45rem,5.6vw,2.2rem)/1.15 var(--f-head);letter-spacing:-.025em;text-wrap:balance}
.meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 16px;font:500 12px var(--f-mono);color:var(--faint)}
.legend{color:var(--faint)}
.live-box{position:relative;margin:20px 14px 0;padding:20px 20px 18px;border-radius:20px;background:var(--ink);color:#fff;overflow:hidden}
.live-box::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(143,139,255,.55),transparent 70%);pointer-events:none}
.live-label{display:flex;align-items:center;gap:8px;font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.62);margin-bottom:10px}
.live-label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent-2);animation:pulse2 1.8s infinite}
@keyframes pulse2{50%{opacity:.35;transform:scale(.7)}}
.live-text{font:600 clamp(19px,5vw,26px)/1.55 var(--f-body);text-wrap:pretty;position:relative}
.live-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;position:relative}
.live-box .tool{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)}
.live-box .tool:hover{background:rgba(255,255,255,.2)}
.live-box .tool.ok{color:#8affc0}
.progress{margin:16px 20px 0;height:3px;border-radius:99px;background:var(--s2);overflow:hidden}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s var(--ease)}
.script{padding:18px 20px 6px;display:flex;flex-direction:column;gap:14px}
.para{font-size:var(--para);line-height:1.95;color:var(--ink);padding:10px 14px;margin:0 -14px;border-radius:14px;opacity:0;transform:translateY(10px);cursor:pointer;transition:background .4s var(--ease),color .3s,opacity .6s var(--ease),transform .6s var(--ease),box-shadow .3s}
.para.in{opacity:1;transform:none}
.para:hover{background:var(--s2)}
.para.now{background:var(--accent-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.para.past{color:var(--faint)}
.para:focus-visible{outline-offset:-2px}
.en,.th{color:inherit}
.spell{font-size:.88em;font-weight:400;font-style:normal;color:var(--mut)}
.num{font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--f-head)}
.key{font-weight:600;color:var(--ink);background:linear-gradient(transparent 55%,rgba(255,91,46,.28) 55%);border-radius:2px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cite{color:var(--accent);font-size:.78em;vertical-align:super;text-decoration:none;padding:0 2px;font-variant-numeric:tabular-nums}
.cite:hover{text-decoration:underline}
.plain{margin:18px 14px 0}
.plain summary{cursor:pointer;list-style:none;font:600 13.5px var(--f-head);color:var(--mut);padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);transition:border-color .2s}
.plain summary:hover{border-color:var(--line2)}
.plain summary::-webkit-details-marker{display:none}
.plain p{padding:12px 16px 4px;font-size:15.5px;line-height:1.8}
.summary{margin:18px 14px 0;padding:18px 20px;border-radius:20px;background:var(--accent-soft);border:1px solid var(--accent-line)}
.summary b{display:block;font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.summary p{font:600 17px/1.6 var(--f-body)}
.follow{margin:18px 14px 0;display:grid;grid-template-columns:1fr;gap:10px}
.fu{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:6px;transition:transform .4s var(--spring),box-shadow .3s}
.fu:hover{transform:translateY(-2px);box-shadow:var(--sh1)}
.fu q{font:600 15px var(--f-body);quotes:none}
.fu p{font-size:15px;color:var(--mut)}
.fu .row{margin-top:4px}
.notes{margin:12px 14px 0;display:grid;gap:10px;grid-template-columns:1fr}
.note{border-radius:18px;border:1px solid var(--line);background:var(--panel);padding:14px 16px}
.note h4{font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.note ul{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mut)}
.note.warn{border-color:rgba(214,38,74,.3);background:rgba(214,38,74,.04)}
.note.warn h4{color:var(--bad)}
.sources{margin:12px 14px 0;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--panel)}
.sources h4{font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.sources ol{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;counter-reset:s}
.sources li{counter-increment:s}
.sources li::before{content:"[" counter(s) "] ";color:var(--faint);font-family:var(--f-mono);font-size:12px}
.sources a{color:var(--accent);text-decoration:none;word-break:break-word}
.sources a:hover{text-decoration:underline}
.card-foot{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:12px 12px 14px;margin-top:16px;border-top:1px solid var(--line)}
.spacer{flex:1}

/* Clarify / error / stall */
.clarify-box{padding:18px 20px;border-radius:22px;border:1px solid var(--glass-b);background:var(--glass);box-shadow:var(--sh1);display:flex;flex-direction:column;gap:12px}
.clarify-q{font-size:15px;color:var(--mut)}
.err{border:1px solid rgba(214,38,74,.35);background:rgba(214,38,74,.05);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;animation:rise .4s var(--ease) both}
.err strong{font:700 15px var(--f-head);color:var(--bad)}
.err p{color:var(--mut);font-size:14.5px}
.err button{align-self:flex-start;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);font-weight:500}
.err button:hover{background:var(--bg2)}
.stall{position:fixed;left:50%;bottom:210px;transform:translateX(-50%);max-width:92vw;width:max-content;padding:14px 20px;border-radius:20px;background:var(--glass-b);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--sh2);border:1px solid var(--accent-line);font:600 19px/1.5 var(--f-body);text-align:center;z-index:85;display:none}

/* Dock */
.dock{position:relative;z-index:20;padding:4px var(--gut) max(10px,env(safe-area-inset-bottom))}
.dock::before{content:"";position:absolute;left:0;right:0;bottom:0;height:140%;background:linear-gradient(transparent,var(--bg) 62%);pointer-events:none;z-index:-1}
.dock-in{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.player{display:flex;align-items:center;gap:2px;min-height:48px;padding:4px;border:1px solid var(--glass-b);border-radius:999px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:var(--sh1);animation:rise .4s var(--ease) both}
.play{min-height:40px;padding:0 20px 0 16px;border-radius:999px;background:var(--ink);color:#fff;font:600 14px var(--f-head);display:inline-flex;align-items:center;gap:8px;transition:transform .35s var(--spring),background .2s}
.play:hover{background:#232838}
.play:active{transform:scale(.94)}
.play[data-on="true"]{background:var(--accent)}
.round,.speed,.present{height:40px;min-width:40px;border-radius:999px;display:inline-grid;place-items:center;padding:0 10px;color:var(--mut);border:0;background:transparent;font:500 13px var(--f-mono);transition:background .2s,color .2s,transform .3s var(--spring)}
.present{display:inline-flex;gap:6px;align-items:center}
.round:hover,.speed:hover,.present:hover{background:var(--s2);color:var(--ink)}
.round:active,.speed:active,.present:active{transform:scale(.88)}
#prev{margin-left:auto}

.composer{display:flex;align-items:flex-end;gap:6px;padding:6px;border-radius:28px;border:1px solid var(--glass-b);background:rgba(255,255,255,.92);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:var(--sh2);transition:border-color .25s,box-shadow .25s}
.composer:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft),var(--sh2)}
.composer.listening{border-color:var(--bad);box-shadow:0 0 0 4px rgba(214,38,74,.12),var(--sh2)}
textarea#input{flex:1;min-width:0;resize:none;min-height:44px;max-height:140px;padding:11px 6px 11px 14px;font-size:16px;line-height:1.5;border:0;background:none;box-shadow:none;border-radius:0}
textarea#input:focus{box-shadow:none}
textarea#input::placeholder{color:var(--faint)}
textarea.interim{color:var(--mut)}
.mic,.send{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .35s var(--spring),background .2s,opacity .2s}
.mic{background:var(--s2);color:var(--ink)}
.mic:hover{background:var(--s3)}
.mic:active,.send:active{transform:scale(.88)}
.mic .ico{width:19px;height:19px}
.mic[aria-pressed="true"]{background:var(--bad);color:#fff;animation:mic 1.4s infinite}
@keyframes mic{0%{box-shadow:0 0 0 0 rgba(214,38,74,.45)}100%{box-shadow:0 0 0 12px rgba(214,38,74,0)}}
.send{background:linear-gradient(135deg,var(--accent),#6a5cff);color:#fff;box-shadow:0 6px 16px -6px rgba(61,53,255,.7)}
.send:hover:not(:disabled){transform:translateY(-2px) scale(1.05)}
.send:disabled{opacity:1;background:var(--s2);color:var(--faint);box-shadow:none;cursor:not-allowed}
.send[data-stop="true"]{background:var(--ink);color:#fff;box-shadow:none}
.foot{display:flex;justify-content:flex-end;font:500 11.5px var(--f-mono);color:var(--faint);padding:0 12px;min-height:0}
.foot:has(#count:empty){display:none}
.player{display:none!important}


/* Question suggestions */
.qsug{display:flex;flex-direction:column;gap:2px;padding:6px;border:1px solid var(--glass-b);border-radius:22px;background:rgba(255,255,255,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--sh2);animation:rise .25s var(--ease) both}
.qsug[hidden]{display:none}
.qs{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border-radius:16px;text-align:left;font-size:14.5px;line-height:1.4;transition:background .2s}
.qs:hover,.qs:focus-visible{background:var(--accent-soft)}
.qs i,.chip .ct i{flex:none;font:500 10.5px/1 var(--f-mono);font-style:normal;letter-spacing:.05em;color:var(--accent);background:var(--accent-soft);padding:5px 9px;border-radius:99px;white-space:nowrap}
.chip .ct{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
@media (min-width:900px){.sugg{flex-wrap:wrap}.chip{flex:1 1 calc(50% - 8px);flex-direction:row;align-items:center;min-height:76px}}

/* Presentation */
.pres{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;padding:max(env(safe-area-inset-top),20px) 22px max(env(safe-area-inset-bottom),20px)}
.pres.open{display:flex;animation:rise .35s var(--ease) both}

.pres-bar{height:3px;background:var(--s2);border-radius:99px;overflow:hidden;margin:12px 0 0}
.pres-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0;transition:width .5s var(--ease)}
.pres-body{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 0;overflow:hidden}
.pres-text{max-width:26ch;font:600 clamp(1.7rem,6vw,3.4rem)/1.4 var(--f-body);text-align:center;text-wrap:balance;letter-spacing:-.01em}
.pres-ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pres-ctrl .play{flex:1;justify-content:center}
.toasts{position:fixed;top:78px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;width:max-content;max-width:92vw}
.toast{padding:10px 18px;border-radius:999px;background:var(--ink);color:#fff;box-shadow:var(--sh2);font-size:14px;animation:toast .5s var(--spring) both}
@keyframes toast{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.thread,.side-body{scrollbar-width:thin;scrollbar-color:var(--s3) transparent}

@media (min-width:640px){ /* sm */

  .follow{grid-template-columns:1fr 1fr}

}

  /* =====================================================================
     7. DATASETS (retrieval over user-owned text, stored locally)
     ===================================================================== */
  const Datasets = {
    grams(x) { const t = x.toLowerCase().replace(/\s+/g, ''), g = new Set(); for (let i = 0; i < t.length - 1; i++) g.add(t.slice(i, i + 2)); return g; },
    retrieve(q) {
      const on = DS.filter(d => d.on);
      if (!on.length) return '';
      const total = on.reduce((n, d) => n + d.text.length, 0);
      const chunks = [];
      on.forEach(d => d.text.split(/\n{2,}/).forEach(p => {
        p = p.trim();
        for (let i = 0; p && i < p.length; i += 700) chunks.push({ t:d.title, x:p.slice(i, i + 700), s:0 });
      }));
      let out = '';
      if (total <= 3500) chunks.forEach(c => { out += '[' + c.t + '] ' + c.x + '\n'; });
      else {
        const qg = this.grams(q);
        chunks.forEach(c => { const cg = this.grams(c.x); let n = 0; qg.forEach(g => { if (cg.has(g)) n++; }); c.s = n / Math.sqrt(cg.size + 1); });
        chunks.sort((a, b) => b.s - a.s);
        let used = 0;
        for (const c of chunks) { if (c.s <= 0 || used >= 5 || out.length > 3800) break; out += '[' + c.t + '] ' + c.x + '\n'; used++; }
      }
      return out ? '\n[ชุดข้อมูลโครงการ]\n' + out : '';
    },
    usedTitles(q) { return DS.filter(d => d.on && this.grams(d.text).size && this.retrieve(q).indexOf('[' + d.title + ']') !== -1).map(d => d.title); },
    add(title, text) {
      text = (text || '').trim();
      if (!text) return toast('ไม่มีข้อความ');
      if (DS.length >= MAX_DS) return toast('ชุดข้อมูลเต็ม ' + MAX_DS + ' ชุด');
      DS.unshift({ id:uid(), title:(title || '').trim().slice(0, 60) || 'ไม่มีชื่อ', text:text.slice(0, 60000), on:true });
      saveDS();
    }
  };

      let t = '[ตั้งค่าบทพูด] ความยาว ' + len + ' (ยึดตามนี้แทนกฎความยาวในข้อ 3) ผู้ฟังคือ' + OPTS.aud[MODE.aud] + ' ปรับระดับศัพท์และน้ำเสียงให้เหมาะ';
      if (MODE.spd === 0) t += ' โหมดด่วน: ผู้ใช้กำลังถูกถามสดในที่ประชุม live ต้องตอบตรงคำถามใน 1–2 ประโยคที่พูดได้ทันที paras เพียง 2–3 ย่อหน้า ห้ามถามกลับถ้าตอบได้';
      const prev = db.turns.slice(-2);
      if (prev.length) t += '\n[บริบทก่อนหน้า ใช้เมื่อคำถามใหม่อ้างถึง]\n' + prev.map(x => 'ถาม: ' + x.q + '\nตอบ: ' + x.ans.live).join('\n');
      return t;
    },
    identity() { return '\n[โปรไฟล์ผู้ใช้ (ข้อเท็จจริงจริง)]\n' + PROFILE + '\n'; },
    build(q, opts) {
      const parts = [q, this.modeText(), this.identity()];
      const ret = Datasets.retrieve(q);
      if (ret) parts.push(ret);
      if (opts && opts.instruction) parts.push('[คำสั่งเพิ่มเติม] ' + opts.instruction);
      if (S.web) parts.push('[web=true] ค้นหาเว็บทุกครั้งก่อนตอบ แล้วเขียนคำตอบสั้นและบทพูดจากผลการค้นหา อ้างอิง [n] ให้ครบทุกข้อเท็จจริงจากเว็บ');
      return parts.join('\n');
    }
  };

  class ContractError extends Error {}
  class NoEndpoint extends Error { constructor(){ super('no endpoint'); this.code = 'NO_ENDPOINT'; } }
  class Timeout extends Error { constructor(){ super('timeout'); this.code = 'TIMEOUT'; } }

  const Model = {
    async call(input, signal) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), API_TIMEOUT_MS);
      const onAbort = () => ctrl.abort();
      signal.addEventListener('abort', onAbort, { once:true });
      try {
        const res = await fetch(API_URL, {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ system: SYSTEM_PROMPT, input, web: S.web, version: VERSION }),
          signal: ctrl.signal
        });
        if (res.status === 404 || res.status === 501) throw new NoEndpoint();
        if (!res.ok) throw new Error('http ' + res.status);
        const d = await res.json();
        return d && d.content !== undefined ? d.content : d;
      } catch (err) {
        if (signal.aborted) throw new DOMException('aborted', 'AbortError');
        if (ctrl.signal.aborted) throw new Timeout();
        if (err && err.code) throw err;
        if (err instanceof TypeError) throw new NoEndpoint();
        throw err;
      } finally {
        clearTimeout(timer);
        signal.removeEventListener('abort', onAbort);
      }
    }
  };

  /* =====================================================================

     ===================================================================== */
  function extractJson(text){
    if (typeof text !== 'string') throw new ContractError('empty');
    const t = text.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a === -1 || b === -1) throw new ContractError('no json');
    return JSON.parse(t.slice(a, b + 1));
  }
  function parseSources(v){
    return (Array.isArray(v) ? v : []).map(s => ({
      title: s && typeof s.title === 'string' ? s.title.trim().slice(0, 120) : '',
      url: s && typeof s.url === 'string' ? s.url.trim() : ''
    })).filter(s => s.title && /^https:\/\//.test(s.url)).slice(0, 8);
  }
  function validate(raw){
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new ContractError('not object');
    const title = str(raw.title, 90);
    const paras = strArr(raw.paras, 700, 12);
    if (!title) throw new ContractError('title');
    if (!paras.length) throw new ContractError('paras');
    const followups = (Array.isArray(raw.followups) ? raw.followups : [])
      .map(f => ({ q: str(f && f.q, 160), a: str(f && f.a, 300) })).filter(f => f.q && f.a).slice(0, 4);

      title,
      live: str(raw.live, 400) || firstSentence(paras[0]),

      paras,
      summary: str(raw.summary, 300),

      key_points: strArr(raw.key_points, 200, 4),

      from_data: strArr(raw.from_data, 80, 6),
      clarify: strArr(raw.clarify, 120, 4),
      assumptions: strArr(raw.assumptions, 200, 6),
      needs_check: strArr(raw.needs_check, 200, 6),
      sources: parseSources(raw.sources)
    };
  }

  /* =====================================================================
     12. PIPELINE: intake -> retrieve -> compose -> model -> validate -> lint
     ===================================================================== */
  const Pipeline = {
    async run(q, opts, onStage, signal) {
      onStage(1);
      const input = Prompt.build(q, opts);
      onStage(2);
      let lastErr = null;
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const raw = await Model.call(attempt ? input + '\n[แก้ไข] ตอบเป็น JSON ตามรูปแบบที่กำหนดเท่านั้น' : input, signal);
          const data = typeof raw === 'string' ? extractJson(raw) : raw;
          onStage(3);
          const ans = validate(data);
          S.demo = false;
          return { ans, demo: false };
        } catch (err) {
          if (err && err.name === 'AbortError') throw err;
          if (err && err.code === 'TIMEOUT') throw err;
          if (err && err.code === 'NO_ENDPOINT') break;
          lastErr = err;
          if (!(err instanceof ContractError || err instanceof SyntaxError)) break;
        }
      }
      if (lastErr instanceof ContractError || lastErr instanceof SyntaxError) throw lastErr;
      if (lastErr && !(lastErr.code === 'NO_ENDPOINT')) throw lastErr;
      onStage(2);
      await sleep(reduce ? 120 : 650, signal);
      onStage(3);
      S.demo = true;
      return { ans: validate(demoAnswer(q)), demo: true };
    }
  };

  /* Lint: deterministic checks that run after validation. Returns warning strings. */
  function lint(a, q){
    const w = [];
    const n = a.paras.length;
    if (a.kind !== 'fact' && n < 2) w.push('ย่อหน้าน้อยกว่า 2 ข้อ');
    if (n > 10) w.push('ย่อหน้าเกิน 10 ข้อ');
    if (a.paras.some(p => p.length > 400)) w.push('มีย่อหน้ายาวเกินหนึ่งลมหายใจ');
    if (!a.key_points.length) w.push('ไม่มีจุดสำคัญ');
    if (a.paras.some(p => /\[ใส่/.test(p))) w.push('มีช่องที่ต้องใส่ตัวเลขจริง');
    if (a.confidence === 'low') w.push('ความมั่นใจต่ำ ควรตรวจก่อนพูด');
    const src = PROFILE + ' ' + DS.filter(d => d.on).map(d => d.text).join(' ') + ' ' + (q || '');
    const bad = new Set();
    (a.paras.join(' ').replace(/\[\d{1,2}\]/g, '').match(/\d+(?:[.,]\d+)?\s?(?:%|เปอร์เซ็นต์|เท่า|ms|มิลลิวินาที)?/g) || []).forEach(m => {
      const token = m.trim(), bare = token.match(/\d+(?:[.,]\d+)?/)[0], num = parseFloat(bare.replace(',', '.'));
      const unit = /%|เปอร์เซ็นต์|เท่า|ms|มิลลิวินาที/.test(token);
      if ((unit || num > 10) && !new RegExp('(^|[^0-9])' + bare.replace(/[.,]/g, '[.,]') + '([^0-9]|$)').test(src)) bad.add(token);
    });
    if (bad.size) w.push('ตัวเลขที่ไม่มีในข้อมูลของคุณ: ' + [...bad].slice(0, 4).join(', ') + ' ห้ามพูดว่าเป็นของจริง');
    return w;
  }

  /* Key sentences: model-provided first, otherwise chosen from numbers and known terms. */
  function keyPairs(a){
    if (a.key_points && a.key_points.length) {
      return a.key_points.map(k => { let i = a.paras.findIndex(p => p.indexOf(k) !== -1); if (i < 0) i = a.paras.findIndex(p => plainText(p).indexOf(plainText(k)) !== -1); return { text:k, para:i }; }).filter(k => k.para >= 0);
    }
    const out = [];
    a.paras.forEach((p, pi) => {
      const hit = p.split(/(?<=[.!?])\s+|(?<=ครับ)\s+/).find(s => /\d/.test(s) || TERM_KEYS.some(k => s.toLowerCase().indexOf(k.toLowerCase()) !== -1));
      if (hit && out.length < 4) out.push({ text:hit.trim(), para:pi });
    });
    return out;
  }

  /* =====================================================================
     13. ANNOTATION: spelling and meaning in parentheses
     ===================================================================== */
  let SEEN = new Set(), SRC = [];
  function annotate(text, key){
    if (!key || text.indexOf(key) === -1) return annotateInline(text);
    const i = text.indexOf(key);
    const frag = document.createDocumentFragment();
    frag.appendChild(annotateInline(text.slice(0, i)));
    const mark = h('span', 'key');
    mark.appendChild(annotateInline(key));
    frag.appendChild(mark);
    frag.appendChild(annotateInline(text.slice(i + key.length)));
    return frag;
  }
  function annotateInline(text){
    const frag = document.createDocumentFragment();
    let last = 0;
    text.replace(TERM_RE, (m, term, cite, num, offset) => {
      if (offset > last) frag.appendChild(document.createTextNode(text.slice(last, offset)));
      if (term) {
        const en = TERM_BY_EN.get(term.toLowerCase()), th = TERM_BY_TH.get(term);
        if (en) {
          frag.appendChild(h('span', 'en', en.en));
          if (!SEEN.has(en.en)) { SEEN.add(en.en); frag.appendChild(h('span', 'spell', ' (' + en.th + ', ' + en.gloss + ')')); }
        } else if (th) {
          frag.appendChild(h('span', 'th', th.th));
          if (!SEEN.has(th.en)) { SEEN.add(th.en); frag.appendChild(h('span', 'spell', ' (' + th.en + ', ' + th.gloss + ')')); }
        } else frag.appendChild(document.createTextNode(m));
      } else if (cite) {
        const sr = SRC[Number(cite) - 1];
        if (sr && /^https:\/\//.test(sr.url)) { const a = h('a', 'cite', '[' + cite + ']'); a.href = sr.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.title = sr.title || ''; a.addEventListener('click', ev => ev.stopPropagation()); frag.appendChild(a); }
        else frag.appendChild(document.createTextNode(m));
      } else frag.appendChild(h('span', 'num', m));
      last = offset + m.length;
      return m;
    });
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    return frag;
  }
  function collectTerms(paras){
    const seen = new Map();
    paras.forEach((p, pi) => (p.match(TERM_RE) || []).forEach(m => {
      const e = TERM_BY_EN.get(m.toLowerCase()) || TERM_BY_TH.get(m);
      if (e && !seen.has(e.en)) seen.set(e.en, { entry:e, para:pi });
    }));
    return [...seen.values()];
  }

  function speakOne(text, rate){
    if (!synth) return toast('เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง');
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'th-TH'; u.rate = rate;
    const v = pickVoice(); if (v) u.voice = v;
    synth.speak(u);
  }
  function pickVoice(){
    if (!synth || !S.voice) return null;
    return synth.getVoices().find(v => v.name === S.voice) || null;
  }
  function highlight(card, idx){
    const els = [...card.querySelectorAll('.para')];
    els.forEach((p, i) => { p.classList.toggle('now', i === idx); p.classList.toggle('past', i < idx); });
    if (els[idx]) els[idx].scrollIntoView({ block:'center', behavior: reduce ? 'auto' : 'smooth' });
    card.querySelector('.progress span').style.width = ((idx + 1) / els.length * 100) + '%';
    $('nowLabel').textContent = (idx + 1) + ' / ' + els.length;
  }
  function clearHighlight(card){
    card.querySelectorAll('.para').forEach(p => p.classList.remove('now', 'past'));
    card.querySelector('.progress span').style.width = '0%';
  }
  function setPlayUI(on){
    const b = $('play');
    b.dataset.on = String(on);
    b.innerHTML = '<svg class="ico" viewBox="0 0 24 24" style="width:15px;height:15px">' + (on ? ICON.stop : ICON.play) + '</svg><span>' + (on ? 'หยุดอ่าน' : 'อ่านบทพูด') + '</span>';
  }
  function updatePlayer(){
    const t = activeTurn();
    const has = !!t && !!synth;
    const n = t ? t.ans.paras.length : 0;
    const idx = S.play ? S.play.idx : -1;
    $('play').disabled = !has;
    $('speed').disabled = !has;
    $('present').disabled = !t;
    $('prev').disabled = !has || idx <= 0;
    $('next').disabled = !has || (idx < 0 ? n === 0 : idx >= n - 1);
    $('speed').textContent = S.rate + 'x';
    if (!S.play) { setPlayUI(false); $('nowLabel').textContent = t ? t.ans.title : ''; }
  }
  function togglePlay(){
    if (S.play) return stopPlay();
    const t = activeTurn(), card = cardOf(t);
    if (t && card) startPlay(t, card, 0);
  }
  function startPlay(turn, card, from){
    stopPlay();
    if (!synth) return toast('เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง');
    S.play = { card, turn, idx: from };
    setPlayUI(true);
    speakFrom(S.play);
  }
  function speakFrom(tok){
    if (S.play !== tok) return;
    if (tok.idx >= tok.turn.ans.paras.length) return finishPlay(tok.card, false);
    highlight(tok.card, tok.idx);
    const u = new SpeechSynthesisUtterance(tok.turn.ans.paras[tok.idx]);
    u.lang = 'th-TH'; u.rate = S.rate;
    const v = pickVoice(); if (v) u.voice = v;
    u.onend = () => { if (S.play !== tok) return; tok.idx++; speakFrom(tok); };
    u.onerror = () => { if (S.play === tok) finishPlay(tok.card, true); };
    synth.speak(u);
  }
  function jumpTo(idx){
    const t = activeTurn(), card = cardOf(t);
    if (!t || !card) return;
    const els = [...card.querySelectorAll('.para')];
    if (els[idx]) els[idx].scrollIntoView({ block:'center', behavior: reduce ? 'auto' : 'smooth' });
    if (S.play && S.play.card === card) {
      synth.cancel();
      S.play.idx = idx;
      setTimeout(() => speakFrom(S.play), 80);
    }
  }
  function step(d){
    const t = activeTurn(); if (!t) return;
    const base = S.play ? S.play.idx : -1;
    jumpTo(Math.max(0, Math.min(t.ans.paras.length - 1, base + d)));
  }
  function finishPlay(card, failed){
    if (failed) toast('อ่านออกเสียงไม่สำเร็จ');
    S.play = null;
    clearHighlight(card);
    setPlayUI(false);
    updatePlayer();
  }
  function stopPlay(){
    if (!S.play) return;
    const card = S.play.card;
    S.play = null;
    if (synth) synth.cancel();
    clearHighlight(card);
    setPlayUI(false);
    updatePlayer();
  }

  const Present = {
    open(){
      const t = activeTurn(); if (!t) return;
      stopPlay();
      S.presIdx = 0; S.presOpen = true;
      $('pres').classList.add('open');
      this.render();
      $('presClose').focus();
    },
    close(){
      this.autoStop();
      if (synth) synth.cancel();
      S.presOpen = false;
      $('pres').classList.remove('open');
      $('present').focus();
    },
    render(){
      const t = activeTurn(); if (!t) return;
      const paras = t.ans.paras;
      $('presText').textContent = paras[S.presIdx];
      $('presCount').textContent = (S.presIdx + 1) + ' / ' + paras.length;
      $('presBar').style.width = ((S.presIdx + 1) / paras.length * 100) + '%';
      $('presPrev').disabled = S.presIdx === 0;
      $('presNext').disabled = S.presIdx === paras.length - 1;
    },
    step(d){
      const t = activeTurn(); if (!t) return;
      S.presIdx = Math.max(0, Math.min(t.ans.paras.length - 1, S.presIdx + d));
      this.render();
    },
    autoStop(){
      clearTimeout(S.presTimer); S.presTimer = null;
      $('presAuto').textContent = 'เลื่อนอัตโนมัติ';
    },
    autoTick(){
      const t = activeTurn(); if (!t) return this.autoStop();
      const p = t.ans.paras[S.presIdx] || '';
      S.presTimer = setTimeout(() => {
        if (S.presIdx >= t.ans.paras.length - 1) return this.autoStop();
        this.step(1); this.autoTick();
      }, Math.max(2500, p.length * 140 / S.rate));
    },
    toggleAuto(){
      if (S.presTimer) return this.autoStop();
      $('presAuto').textContent = 'หยุดเลื่อน';
      this.autoTick();
    },
    speak(){
      const t = activeTurn(), card = cardOf(t);
      if (!t || !card) return;
      this.close();
      startPlay(t, card, S.presIdx);
    }
  };

  function setBusy(on){
    S.busy = on;
    $('body').classList.toggle('busy', on);
    $('send').dataset.stop = String(on);
    $('send').setAttribute('aria-label', on ? 'หยุดการตอบ' : 'ส่ง');

    $('statusTxt').textContent = on ? (S.web ? 'กำลังค้นหาและประมวลผล' : 'กำลังประมวลผล') : (S.demo ? 'โหมดตัวอย่าง' : 'ออนไลน์');

  function setPv(pipe, text){
    const el = pipe.querySelector('.pv');
    if (el) el.textContent = text || '';
  }
  async function submit(raw, opts){
    const q = (raw || '').trim();
    if (S.busy || !q) return;
    stopListening();
    const col = $('col');
    if (!db.turns.length) col.replaceChildren();
    const qEl = Render.question(q);
    const pipe = Render.pipeline();
    col.append(qEl, pipe);
    $('input').value = ''; sizeInput(); setBusy(true);
    scrollToLast(false);
    S.ctrl = new AbortController();
    const stallTimer = setTimeout(() => setPv(pipe, STALLS[S.stallI++ % STALLS.length]), 6000);
    try {
      const { ans, demo } = await Pipeline.run(q, opts || {}, idx => Render.setStage(pipe, idx), S.ctrl.signal);
      if (ans.clarify.length && q.indexOf('(') === -1 && !(opts && opts.instruction)) {
        pipe.remove();
        col.appendChild(Render.clarify(q, ans.clarify));
        scrollToLast(false);
        return;
      }
      const turn = { id: uid(), q, ans, demo, web: S.web, ts: Date.now() };
      db.turns = [...db.turns, turn].slice(-MAX_TURNS);
      saveTurns();
      pipe.remove();
      const card = Render.card(turn);
      col.appendChild(card);
      revealCard(card);
      setActive(turn.id);
      updatePlayer();
      scrollToLast(false);
    } catch (err) {
      pipe.remove();
      if (err && err.name === 'AbortError') { qEl.remove(); toast('หยุดการตอบแล้ว'); }
      else {
        const msg = err instanceof ContractError || err instanceof SyntaxError
          ? 'คำตอบที่ได้รับไม่อยู่ในรูปแบบที่กำหนด ลองอีกครั้ง'
          : err && err.code === 'TIMEOUT' ? 'รอคำตอบนานเกินไป ลองอีกครั้ง' : 'เชื่อมต่อไม่ได้ในขณะนี้ ลองอีกครั้ง';
        col.appendChild(Render.error(() => { col.lastElementChild && col.lastElementChild.remove(); qEl.remove(); submit(q, opts); }, msg));
      }
    } finally {
      clearTimeout(stallTimer);
      S.ctrl = null; setBusy(false);
    }
  }
  async function regenerate(id, instruction){
    if (S.busy) return toast('รอให้คำตอบเสร็จก่อน');
    const turn = db.turns.find(t => t.id === id);
    if (!turn) return;
    const old = cardOf(turn);
    if (S.play && S.play.card === old) stopPlay();
    setBusy(true);
    if (old) old.style.opacity = '.45';
    S.ctrl = new AbortController();
    try {
      const { ans, demo } = await Pipeline.run(turn.q, { instruction }, () => {}, S.ctrl.signal);
      turn.ans = ans; turn.demo = demo; saveTurns();
      const fresh = Render.card(turn);
      if (old) old.replaceWith(fresh); else $('col').appendChild(fresh);
      revealCard(fresh); setActive(id); updatePlayer();
    } catch (err) {
      if (old) old.style.opacity = '';
      if (!(err && err.name === 'AbortError')) toast('สร้างบทพูดใหม่ไม่สำเร็จ');
    } finally { S.ctrl = null; setBusy(false); }
  }
  function stopGeneration(){ if (S.ctrl) S.ctrl.abort(); }

  /* =====================================================================
     19. COMPOSER AND VOICE
     ===================================================================== */
  function sizeInput(){
    const input = $('input');
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    const n = input.value.length;
    $('count').textContent = n > 1600 ? n + ' / 2000' : '';
  }
  function updateSend(){ $('send').disabled = S.busy ? false : !$('input').value.trim(); }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  if (SR) {
    rec = new SR();
    rec.lang = 'th-TH'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = e => {
      let fin = '', interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) fin += t; else interim += t;
      }
      if (fin) S.base = (S.base + ' ' + fin).trim();
      const input = $('input');
      input.value = (S.base + ' ' + interim).trim();
      input.classList.toggle('interim', !!interim);
      sizeInput(); updateSend();
    };
    rec.onend = () => { if (S.listening) { try { rec.start(); } catch (_) {} } };
    rec.onerror = () => { stopListening(); toast('ไมโครโฟนใช้ไม่ได้ ตรวจสอบสิทธิ์การเข้าถึง'); };
  } else { $('mic').disabled = true; $('mic').title = 'เบราว์เซอร์นี้ไม่รองรับการพูด'; }
  function startListening(){
    if (!rec || S.busy) return;
    S.listening = true; S.base = $('input').value.trim();
    $('form').classList.add('listening');
    $('mic').setAttribute('aria-pressed', 'true'); $('micTxt').textContent = 'หยุด';
    try { rec.start(); } catch (_) {}
  }
  function stopListening(){
    if (!S.listening) return;
    S.listening = false;
    $('form').classList.remove('listening');
    $('input').classList.remove('interim');
    $('mic').setAttribute('aria-pressed', 'false'); $('micTxt').textContent = 'พูด';
    try { rec && rec.stop(); } catch (_) {}
  }

  /* =====================================================================
     20. EVENTS
     ===================================================================== */
  function bind(){
    const input = $('input');
    $('form').addEventListener('submit', e => { e.preventDefault(); if (S.busy) return stopGeneration(); submit(input.value); });
    input.addEventListener('input', () => { sizeInput(); updateSend(); });
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); } });
    $('mic').addEventListener('click', () => S.listening ? stopListening() : startListening());
    $('play').addEventListener('click', togglePlay);
    $('prev').addEventListener('click', () => step(-1));
    $('next').addEventListener('click', () => step(1));
    $('speed').addEventListener('click', () => {
      S.rate = RATES[(RATES.indexOf(S.rate) + 1) % RATES.length];
      $('speed').textContent = S.rate + 'x';
      savePrefs();
      if (S.play) jumpTo(S.play.idx);
      renderSide();
    });
    $('present').addEventListener('click', () => Present.open());
    $('presClose').addEventListener('click', () => Present.close());
    $('presPrev').addEventListener('click', () => Present.step(-1));
    $('presNext').addEventListener('click', () => Present.step(1));
    $('presPlay').addEventListener('click', () => Present.speak());
    $('presAuto').addEventListener('click', () => Present.toggleAuto());
    $('panelBtn').addEventListener('click', () => setPanel(!S.panel));
    ['gloss','key','data','read'].forEach(n => {
      $('tab' + n.charAt(0).toUpperCase() + n.slice(1)).addEventListener('click', () => setTab(n));
    });
    let armed = false, armTimer = null;
    $('newBtn').addEventListener('click', () => {
      if (S.busy) return toast('รอให้คำตอบเสร็จก่อน');
      if (!db.turns.length) return input.focus();
      if (!armed) {
        armed = true; toast('กดอีกครั้งเพื่อเริ่มคำถามใหม่');
        clearTimeout(armTimer); armTimer = setTimeout(() => armed = false, 2600);
        return;
      }
      armed = false; stopPlay(); Present.autoStop();
      db.turns = []; S.active = null; saveTurns(); renderThread(); input.focus();
    });
    $('thread').addEventListener('click', ev => { if (S.panel && window.innerWidth < 900 && !ev.target.closest('.para,a,button,summary,input,textarea')) setPanel(false); });
    document.addEventListener('keydown', e => {
      if (S.presOpen) {
        if (e.key === 'Tab') {
          const f = [...$('pres').querySelectorAll('button:not(:disabled)')], ac = document.activeElement;
          if (f.length) {
            if (!$('pres').contains(ac)) { e.preventDefault(); f[0].focus(); }
            else if (e.shiftKey && ac === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
            else if (!e.shiftKey && ac === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
          }
          return;
        }
        if (e.key === 'Escape') return Present.close();
        if (e.key === 'ArrowRight') return Present.step(1);
        if (e.key === 'ArrowLeft') return Present.step(-1);
        if (e.key === ' ') { e.preventDefault(); return Present.speak(); }
        return;
      }
      const editing = e.target === input || (e.target.matches && e.target.matches('input,textarea,select'));
      if (e.key === '/' && !editing) { e.preventDefault(); input.focus(); return; }
      if (e.key === ' ' && !editing && !e.target.closest('button,a')) { e.preventDefault(); togglePlay(); return; }
      if (e.key === 'ArrowRight' && !editing) return step(1);
      if (e.key === 'ArrowLeft' && !editing) return step(-1);
      if (e.key === 'Escape') {
        if (S.busy) stopGeneration();
        if (S.play) stopPlay();
        if (S.panel && window.innerWidth < 1280) setPanel(false);
      }
    });
    addEventListener('online', () => { netSync(); toast('กลับมาออนไลน์แล้ว'); });
    addEventListener('offline', () => { netSync(); toast('ออฟไลน์ ข้อมูลยังอยู่ในเครื่อง'); });
    addEventListener('pagehide', () => { if (S.play) stopPlay(); Present.autoStop(); });
    addEventListener('resize', () => { if (window.innerWidth >= 1280 && !S.panel) setPanel(true); });
    if (synth) synth.onvoiceschanged = () => { if (S.panel && S.tab === 'read') renderSide(); };
  }
  function netSync(){
    const on = navigator.onLine;
    $('status').classList.toggle('off', !on);
    if (!S.busy) $('statusTxt').textContent = on ? (S.demo ? 'โหมดตัวอย่าง' : 'ออนไลน์') : 'ออฟไลน์';
  }

    PQ('เรียนรู้เรื่องใหม่ๆ ยังไง และใช้ภาษาอะไรได้บ้าง', 'การเรียนรู้และภาษา',

      ['ผมเรียนรู้ด้วยตนเองต่อเนื่องตั้งแต่ปี 2015 และร่วมชุมชน GDG Bangkok กับ AI BKK',
       'ภาษาไทยเป็นภาษาแม่ ส่วนภาษาอังกฤษอยู่ระดับใช้งาน อ่านและเขียนเอกสารเทคนิคได้ และใช้เครื่องมือแปลกับ AI ช่วยงานเอกสารครับ'],
      'เรียนรู้เองต่อเนื่อง ไทยเป็นภาษาแม่ อังกฤษระดับใช้งาน', ['GDG Bangkok กับ AI BKK', 'ระดับใช้งาน'],
      ['ds023'], [['อังกฤษระดับไหน','ระดับใช้งาน อ่านและเขียนเอกสารเทคนิคได้ครับ']], { kind:'fact' }),

      ['งาน Flutter ที่ผมทำมี DNP National Park และ DNP Scout Rangers, Royal Thai Navy, EXAT Portal, DIP IP Mart และ SRITRANG Access Control',

      'Flutter ใช้ทั้งงานอุทยาน กองทัพเรือ ทางพิเศษ ขนส่ง และการแพทย์', ['MRTA Application', 'modular ด้วย Clean Architecture และ MVVM'],
      ['ds019','ds010'], [['งานไหนใช้ QR code','MRTA Application ครับ ใช้กับที่จอดรถและแจ้งเตือนการเดินทาง']], { kind:'explain' }),
    PQ('เคยทำระบบเปิดบัญชีหรือชำระเงินไหม', 'ASP Open Account และการชำระเงิน',
      'เคยครับ ผมทำ ASP Open Account ระบบเปิดบัญชีลงทุนออนไลน์พร้อมตรวจสอบตัวตนดิจิทัล KYC และเคยทำระบบชำระเงินด้วย Stripe',
      ['ASP Open Account เป็นระบบเปิดบัญชีลงทุนออนไลน์ของ Asia Plus Securities พร้อมตรวจสอบตัวตนดิจิทัลแบบ KYC',
       'ด้านการชำระเงิน ผมเคยทำระบบชำระเงินด้วย Stripe และทำแอป MWA-OnMobile ที่ชำระค่าน้ำได้',
       'ส่วนความปลอดภัยของข้อมูล ผมมีประสบการณ์การเข้ารหัสแบบ hybrid AES-256-GCM กับ RSA-4096 และ OAuth2 ครับ'],
      'เปิดบัญชี KYC และชำระเงินด้วย Stripe', ['ตรวจสอบตัวตนดิจิทัลแบบ KYC', 'Stripe'],
      ['ds015','ds010','ds008','ds021'], [['กันตัดเงินซ้ำยังไง','ใช้ idempotency key ต่อหนึ่งการจ่าย และยืนยันผลจาก webhook ของผู้ให้บริการครับ']], { kind:'explain' })
  ];
  const ALIAS = {
    'แนะนำตัวหน่อย':'ประสบการณ์กี่ปี อายุงาน เป็นใคร ชื่ออะไร ตำแหน่งอะไร',
    'ประสบการณ์ทำงานที่ผ่านมามีอะไรบ้าง':'เคยทำงานที่ไหน บริษัท ประวัติการทำงาน อดีต เส้นทางอาชีพ',
    'เคยทำงานให้หน่วยงานรัฐอะไรบ้าง':'ลูกค้าภาครัฐ ลูกค้ามีใคร หน่วยงานราชการ',
    'เคยทำโปรเจกต์ Flutter อะไรบ้าง':'ผลงาน Flutter โปรเจกต์ Flutter แอปที่เคยทำ'
  };
  let _bank = null;
  const KIND_TAG = { explain:'อธิบาย', compare:'เปรียบเทียบ', 'how-to':'วิธีทำ', debug:'แก้ปัญหา', design:'ออกแบบ', interview:'สัมภาษณ์', opinion:'ความเห็น', fact:'ข้อเท็จจริง' };
  function getBank(){
    if (_bank) return _bank;
    _bank = PERSONAL.map(x => ({ q:x.q, ans:x.ans, tag:'เกี่ยวกับคุณ', personal:true }));
    MOCK.main.forEach(t => {
      const a = t.ans;
      if (!a || (a.clarify && a.clarify.length) || /ถอดเสียง/.test(t.q)) return;
      _bank.push({ q:t.q, ans:a, tag:KIND_TAG[a.kind] || 'ทั่วไป', personal:false });
    });
    _bank.forEach(b => { b.hay = [b.q, b.ans.title, b.ans.summary, (b.ans.key_points || []).join(' '), ALIAS[b.q] || ''].join(' '); });
    return _bank;
  }
  const STOP = ['เคย','ทำไม','อะไร','บ้าง','หน่อย','ยังไง','อย่างไร','ไหม','คือ','มี','ได้','ที่','การ','ความ','ผม','คุณ','ของ','และ','กับ','ให้','เล่า','ช่วย','ไหน','ใช้','เป็น','ไง','หรือ','แล้ว','จะ','ต้อง','ถาม','อยาก','รู้','ว่า','นี้','นั้น','เรื่อง','งาน'];
  function toks(x){
    x = (x || '').toLowerCase();
    const lat = new Set((x.match(/[a-z0-9]+(?:[.+#][a-z0-9]+)*/g) || []).filter(t => t.length >= 2));
    let th = x.replace(/[a-z0-9.+#\-_/()]+/g, ' ');
    STOP.forEach(w => { th = th.split(w).join(' '); });
    const g = new Set(), parts = th.split(/[\s,.:;!?'"()\[\]/\\-]+/).filter(Boolean);
    parts.forEach(p => { for (let i = 0; i < p.length - 1; i++) g.add(p.slice(i, i + 2)); });
    return { lat, th:g };
  }
  function sim(q, t){
    const a = toks(q), b = toks(t);
    const mass = a.lat.size * 3 + a.th.size;
    if (!mass) return { cov:0, dice:0, mass:0 };
    let hit = 0, n = 0;
    a.lat.forEach(w => { if (b.lat.has(w)) hit += 3; });
    a.th.forEach(g => { if (b.th.has(g)) { hit += 1; n++; } });
    const bm = b.lat.size * 3 + b.th.size;
    return { cov:hit / mass, dice:bm ? 2 * hit / (mass + bm) : 0, mass };
  }
  function scoreBank(q){
    q = (q || '').trim();
    return getBank().map(b => {
      const s1 = sim(q, b.q), s2 = sim(q, b.hay);
      const qn = q.toLowerCase().replace(/\s+/g, ''), sub = qn.length >= 4 && b.hay.toLowerCase().replace(/\s+/g, '').includes(qn) ? .95 : 0;
      return { b, s:Math.max(s1.dice * 1.15, s2.mass >= 3 ? s2.cov * .9 : 0, sub) };
    }).sort((x, y) => y.s - x.s);
  }
  function suggestFor(q, k){
    q = (q || '').trim();
    if (q.length < 2) {
      const bank = getBank().slice(), out = [];
      while (out.length < k && bank.length) out.push(bank.splice(Math.floor(Math.random() * bank.length), 1)[0]);
      return out;
    }
    const lc = q.toLowerCase();
    return scoreBank(q).filter(x => x.s > .3 || x.b.q.toLowerCase().includes(lc)).slice(0, k).map(x => x.b);
  }
  function composeFromDS(q){
    const scored = DS.filter(d => d.on).map(d => ({ d, r:sim(q, d.title + ' ' + d.text) })).filter(x => x.r.mass >= 3 && x.r.cov >= .5).sort((a, b) => b.r.cov - a.r.cov).slice(0, 3);
    if (!scored.length) return null;
    const cut = t => { if (t.length <= 380) return t; const i = Math.max(t.lastIndexOf(' / ', 380), t.lastIndexOf(' ', 380)); return t.slice(0, i > 120 ? i : 380); };
    const paras = scored.map(x => cut(x.d.text.replace(/^[^:]{1,40}:\s*/, '')) + ' ครับ');
    return {
      title:'จากชุดข้อมูลของคุณ', kind:'fact', confidence:'medium', live:paras[0].replace(/ \/ .*$/, '').slice(0, 160),
      paras, key_points:[], summary:'สรุปจากชุดข้อมูลที่เปิดอยู่', plain:'', followups:[], from_data:scored.map(x => x.d.title),
      clarify:[], assumptions:[], needs_check:['คำตอบนี้ประกอบจากชุดข้อมูลโดยตรง ควรเรียบเรียงเป็นคำพูดของคุณก่อนใช้'], sources:[]
    };
  }
  function notFound(){
    return {
      title:'ยังไม่มีข้อมูลเรื่องนี้ในโหมดตัวอย่าง', kind:'fact', confidence:'low',
      live:'ผมยังไม่มีข้อมูลเรื่องนี้ในชุดข้อมูลครับ ขอให้เชื่อมระบบตอบจริงหรือเพิ่มชุดข้อมูลก่อนนะครับ',
      paras:['โหมดตัวอย่างตอบได้เฉพาะคำถามที่อยู่ในคลังตัวอย่างและชุดข้อมูลที่เปิดอยู่ในแท็บข้อมูล',
             'ลองถามเรื่องประสบการณ์ ทักษะ หรือผลงาน และหัวข้อเทคนิค เช่น Riverpod, Clean Architecture, REST กับ GraphQL หรือเพิ่มชุดข้อมูลของคุณเองเพื่อให้ตอบตรงขึ้นครับ'],
      key_points:['คลังตัวอย่างและชุดข้อมูลที่เปิดอยู่'], summary:'ถามให้ตรงกับคลังตัวอย่าง หรือเชื่อมระบบตอบจริง', plain:'',
      followups:[], from_data:[], clarify:[], assumptions:[], needs_check:[], sources:[]
    };
  }
  function demoAnswer(q){
    const top = scoreBank(q)[0];
    if (top && top.s >= .55) return JSON.parse(JSON.stringify(top.b.ans));
    return composeFromDS(q) || notFound();
  }
  function pickChips(){
    const bank = getBank(), p = bank.filter(b => b.personal), g = bank.filter(b => !b.personal);
    const r = (arr, n) => { arr = arr.slice(); const o = []; while (o.length < n && arr.length) o.push(arr.splice(Math.floor(Math.random() * arr.length), 1)[0]); return o; };
    return r(p, 2).concat(r(g, 2));
  }
  function initSuggest(){
    const input = $('input'), box = $('qsug'); let tm = 0;
    const hide = () => { box.hidden = true; box.replaceChildren(); };
    const render = () => {
      if (S.busy) return hide();
      const list = suggestFor(input.value, input.value.trim().length < 2 ? 3 : 4);
      box.replaceChildren();
      if (!list.length) { box.hidden = true; return; }
      list.forEach(b => {
        const it = h('button', 'qs'); it.type = 'button'; it.setAttribute('role', 'option');
        it.append(h('i', null, b.tag), h('span', null, b.q));
        it.addEventListener('click', () => { input.value = b.q; input.dispatchEvent(new Event('input', { bubbles:true })); hide(); $('form').requestSubmit(); });
        box.appendChild(it);
      });
      box.hidden = false;
    };
    box.addEventListener('pointerdown', e => e.preventDefault());
    input.addEventListener('focus', () => { clearTimeout(tm); render(); });
    input.addEventListener('input', render);
    input.addEventListener('blur', () => { tm = setTimeout(hide, 120); });
    $('form').addEventListener('submit', hide);
  }

  window.ARTYVERSE_MOCK = {
    names: ['main', 'stress', 'ds'],
    load(n){
      if (n === 'ds') { DS = buildSeed().slice(0, MAX_DS); saveDS(); }
      else if (n === 'main' || n === 'stress') { db.turns = MOCK[n].filter(validTurn).slice(-MAX_TURNS); S.active = null; saveTurns(); renderThread(); }
      else return 'unknown: ' + n;
      if (S.panel) renderSide();
      return n + ' loaded';
    }
  };

  /* =====================================================================
     21. BOOT
     ===================================================================== */
  loadAll();
  seedIfEmpty();
  applySize();
  bind();
  initSuggest();
  renderMods();
  setTab('gloss');
  if (window.innerWidth >= 1280) setPanel(true);
  netSync();
  renderThread();
  sizeInput(); updateSend();
})();
</script>
<script>
/* Interaction layer: ripple */
(function(){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  document.addEventListener('pointerdown', function(e){
    var b = e.target.closest && e.target.closest('button'); if(!b || b.disabled) return;
    var r = b.getBoundingClientRect(), n = Math.max(r.width, r.height) * 2, d = document.createElement('span');
    d.className = 'rip'; d.style.cssText = 'width:'+n+'px;height:'+n+'px;left:'+(e.clientX-r.left-n/2)+'px;top:'+(e.clientY-r.top-n/2)+'px';
    b.appendChild(d); setTimeout(function(){ d.remove(); }, 650);
  }, {passive:true});
})();
</script>
